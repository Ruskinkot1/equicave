[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "equicave"
version = "0.2.0"
description = "Self-contained equivariant multi-task model of protein binding pockets"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "pandas", "lightgbm", "scikit-learn", "pyyaml", "tqdm"]

[project.optional-dependencies]
train = ["torch", "transformers", "safetensors"]
e3nn = ["e3nn"]
viz = ["matplotlib"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["equicave*", "training*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
