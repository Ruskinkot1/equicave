# Ablation presets: each entry overrides keys of pockets_net.yaml. Run: python -m training pockets-net --config training/configs/pockets_net.yaml --set ablation=<name>
ablations:
  full: {}
  no_probes: {model.use_probes: false}
  no_surface: {model.use_surface: false}
  no_esm: {data.esm: null}
  no_tensors: {model.use_tensors: false}            # degree <= 1 (vector channels only)
  no_vectors: {model.use_vectors: false, model.invariant_mode: frames}   # no steerable channels, geometry in local frames
  invariant_frames: {model.equivariant: false, model.invariant_mode: frames}   # fair: same geometry, scalarised in a local frame
  invariant_blind: {model.equivariant: false, model.invariant_mode: distances}  # the usual confound: geometry removed as well
  achiral: {model.chiral: false}
  no_recycling: {model.recycles: 0}
  no_sequence_edges: {model.n_edge_scalar: 0}
  no_masked_residue: {loss.mask_frac: 0.0, loss.w_seq: 0.0}
  nearest_probe_loss: {loss.hungarian: false}
  no_residue_chemistry: {data.residue_chemistry: false}
  no_probe_potential: {data.probe_potential: false, loss.w_potential: 0.0, loss.pot_mask_frac: 0.0}
  # Parameter-matched arms. Switching use_tensors off also removes wt, 2*dim of edge input and 3*dim of gates, so
  # the plain no_tensors arm is strictly smaller and `full - no_tensors` measures degree 2 *plus* capacity. These
  # arms widen dim until the parameter count is within 2 % of full, so the comparison isolates the degree.
  no_tensors_matched: {model.use_tensors: false, model.match_params: full}
  no_vectors_matched: {model.use_vectors: false, model.invariant_mode: frames, model.match_params: full}
  # Probe placement: the comparison arm for the only component the first trained ablation found to matter.
  # Random placement within buriedness tiers halves the occupancy positive rate (0.133 against 0.230, measured on
  # 19 structures), so this arm carries its own balancing weight. At the default 3.0 it would be under-weighted
  # twofold and the comparison would measure class weighting as much as placement.
  probe_tiered: {data.probe_sampling: tiered, loss.occ_pos_weight: 6.5}
  # Does degree 2 do nothing, or does it do work our detector has already done? The first ablation measured
  # `full - no_tensors` with the probes at full strength, where the closure field b(p) over the 26 lattice
  # directions has already supplied the enclosure -- its l=0 moment is buriedness, its l=1 moment is which way
  # the cavity opens, its l=2 moment is slot against cone. Anisotropy of pocket shape is a genuinely degree-2
  # quantity; we simply compute it outside the network and hand it over as where the probes are. So a null there
  # says nothing about degree 2 in general, only about degree 2 *given that operator*.
  #
  # These arms cross the two axes. Along one, how much enclosure the operator supplies: ligandable placement
  # (full) > random within buriedness tiers (tiered) > none at all (no_probes). Along the other, whether the
  # network carries degree 2. Parameter-matched on the tensor-free side, since dropping the tensors also drops
  # wt, 2*dim of edge input and 3*dim of gates -- 23.5 % of the model -- while dropping the probes costs nothing.
  #
  # The prediction the reasoning makes: the gap from removing degree 2 grows as the operator supplies less. If it
  # does, the finding is a mechanism -- degree 2 reconstructs enclosure when nothing else provides it -- and not a
  # null. If the gap stays flat at zero, degree 2 is genuinely idle on this task however the work is divided, and
  # that is worth stating as such. Either way the architecture keeps the channels: `use_tensors` stays on by
  # default, because the answer depends on where the line between operator and model is drawn, and that line
  # moves whenever placement becomes learned.
  no_probes_no_tensors: {model.use_probes: false, model.use_tensors: false, model.match_params: full}
  probe_tiered_no_tensors: {data.probe_sampling: tiered, loss.occ_pos_weight: 6.5,
                            model.use_tensors: false, model.match_params: full}
  # New mechanisms, each as a removal from the full model so the baseline is the one that ships.
  no_direction_loss: {loss.w_dir: 0.0}              # P12: the dense cosine target on every probe near one site
  no_listwise: {loss.w_listwise: 0.0}               # P2: the only term that orders probes within a structure
  single_stage: {stages.enabled: false}             # P6: all terms on from epoch 1, the previous schedule
  e3nn_l1: {model.backbone: e3nn, model.lmax: 1}    # with l2 and l3 below this is a real degree sweep
  e3nn_l2: {model.backbone: e3nn, model.lmax: 2}
  e3nn_l3: {model.backbone: e3nn, model.lmax: 3}
  # The site decoder, each piece as a removal so the baseline is the model that ships. The decoder is the answer to
  # a measured failure rather than a guess, so these three arms are the ones that decide whether the diagnosis was
  # right: if `no_site_decoder` matches `full`, pocket-against-pocket comparison is not what was missing.
  no_site_decoder: {model.site_decoder: false}        # back to per-probe confidence, the previous ranking
  no_site_margin: {loss.w_site_margin: 0.0}           # keep the listwise term, drop the one comparison top-1 decides
  no_site_rank: {loss.w_site_rank: 0.0}               # keep the margin, drop the listwise term over sites
  site_layers_4: {model.site_layers: 4}               # is two layers of competition enough
  # Probe motion: one jump onto the predicted centre against several steps along the predicted direction.
  probe_flow: {model.probe_update: flow}
  probe_flow_4: {model.probe_update: flow, model.recycles: 4}
  # The attention kernel, which is a layer-family change and not a symmetry one. The symmetry question is already
  # answered against itself: removing degree-2 costs -0.006 and removing chirality +0.000, so neither a higher
  # degree nor a change of group is where the gain is. What the current literature does report is the shape of the
  # attention. Wang et al. 2026 measure +3.3 % DCC from this kernel alone on a GotenNet backbone like ours.
  gaussian_attn: {model.attn_kernel: gaussian}
  gaussian_attn_4: {model.attn_kernel: gaussian, model.layers: 4}
  # Spend the parameters where the measurement says they work: no degree-2 channels, no chirality, no surface
  # module, no language model -- all four were within seed noise -- and the saving reinvested in depth and probes.
  # This is the model the ablation argues for, and it is a prediction that can fail.
  lean:
    model.use_tensors: false
    model.chiral: false
    model.use_surface: false
    data.esm: null
    model.layers: 7
    data.n_probe: 1024
  # Capacity. Every reduction measured so far came out neutral or slightly positive -- no_tensors 0.849, no_esm
  # 0.853, no_surface 0.854 against full's 0.843 -- so the prior is that 4.39 M parameters is already past what
  # 1367 structures in 1017 clusters can use, and these arms exist to confirm or refute that rather than to be
  # assumed. Read them together with `scale_max` below: if capacity only pays at more data, that is the finding.
  wide: {model.dim: 192}                            # 9.8 M parameters, 2.2x
  deep: {model.layers: 8}                           # 6.7 M, 1.5x
  big: {model.dim: 192, model.layers: 8}            # 14.8 M, 3.4x
  small: {model.dim: 96, model.layers: 4}           # the other direction, which the ablation suggests may be free
  # Data, which is the lever the measurements actually point at. The ranker saturated at 8x data (+0.008 top-1)
  # but the network has never been trained on more than the small manifest even once. Needs its own cache, which
  # run_ablations.sh gives it automatically because the arm touches data.*.
  scale_max: {data.manifest: data/processed/manifest_max.csv}
  scale_max_big: {data.manifest: data/processed/manifest_max.csv, model.dim: 192, model.layers: 8}
