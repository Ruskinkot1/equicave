# Ablation arms. Three sections, and the split is the point.
#
# This file held 57 arms. At three seeds that is 171 runs and about 770 GPU hours, and the arithmetic is worse than
# the time: across 57 arms the expected maximum of pure noise at a seed sd of 0.009 is +0.026, above this project's
# own +0.02 claim threshold (docs/results/PREREGISTERED.md). A grid that size cannot support a claim; it
# manufactures a winner. 33 arms were deleted rather than hidden -- capacity and width sweeps, the e3nn degree
# sweep, the three aggregator variants, the attention-kernel variants, the scale arms and the rest. They were
# questions converted into compute instead of being decided.
#
# Run: python -m training pockets-net --config training/configs/pockets_net.yaml --set ablation=<name>
# Grid: GROUP=core bash scripts/train/run_ablations.sh   (the default, section 1 only)
ablations:

  # ---- 1. The core grid: these five run by default, 15 runs at three seeds
  # the reference; every difference is taken against it
  full: {}
  # candidate baseline: noise augmentation (+0.0976 PR-AUC published) and the protrusion channels (candidate AUC 0.7999 -> 0.8469, ours), bundled
  full_next: {"optim.augment": {"pos": 0.5, "feat": 0.3, "drop": 0.03}, "data.probe_protrusion": true}
  # the one mechanism no published method has. First reading: +0.007 at one seed, a third of the threshold
  no_site_decoder: {"model.site_decoder": false}
  # the headline claim, worth 0.263 -- the only component with a large measured effect
  no_probes: {"model.use_probes": false}
  # the ablation the field does not have, parameter-matched. Also a memory argument: the degree-2 edge messages are [E, F, 3, 3]
  no_tensors_matched: {"model.use_tensors": false, "model.match_params": "full"}

  # ---- 2. Open questions, by name only. Each costs ~4 h per seed, so each needs a reason that day.
  # the single half of full_next with published evidence; run only if full_next wins and you need to know which half
  noise_aug: {"optim.augment": {"pos": 0.5, "feat": 0.3, "drop": 0.03}}
  # the other half, the one backed by our own measurement
  probe_protrusion: {"data.probe_protrusion": true}
  # does the chemistry already in the model do any work? Answer this before adding more
  no_probe_potential: {"data.probe_potential": false, "loss.w_potential": 0.0, "loss.pot_mask_frac": 0.0}
  # all terms from epoch 1. If it ties, the whole staging apparatus is unnecessary
  single_stage: {"stages.enabled": false}
  # random placement within buriedness tiers; carries its own occ_pos_weight or the comparison is confounded
  probe_tiered: {"data.probe_sampling": "tiered", "loss.occ_pos_weight": 6.5}
  # P12, the dense cosine target
  no_direction_loss: {"loss.w_dir": 0.0}
  # P2, the only term that orders probes within a structure
  no_listwise: {"loss.w_listwise": 0.0}
  # bounded by our own measurement at <= 0.034 top-1 before any GPU time; near-zero headroom on the metal class (0.971 of a 0.971 ceiling)
  probe_metal: {"data.probe_metal": true}
  # predicted null: the ionisable-group distances are already in probe_potential
  probe_electrostatic: {"data.probe_electrostatic": true}
  # the only addition with controlled evidence on train-dissimilar structures, and it needs an alignment per target that nothing here produces
  probe_conservation: {"data.probe_conservation": true}
  # does type awareness matter at all
  no_edge_type: {"model.use_edge_type": false}
  # per-edge-type gains; predicted null, since the edge MLP already embeds the same nine types
  het_mp: {"model.het_mp": true}

  # ---- 3. Measured and published (2026-10-06, 3 seeds). Kept so those rows stay reproducible;
  #         not in any group, and re-running them needs the new `full` reference first.
  no_surface: {"model.use_surface": false}
  no_esm: {"data.esm": null}
  no_tensors: {"model.use_tensors": false}
  no_vectors: {"model.use_vectors": false, "model.invariant_mode": "frames"}
  invariant_frames: {"model.equivariant": false, "model.invariant_mode": "frames"}
  achiral: {"model.chiral": false}
  no_recycling: {"model.recycles": 0}
