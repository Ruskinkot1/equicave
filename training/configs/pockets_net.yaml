# EquiCave-Net default configuration (A100: dim 128, layers 5, esm2_t33_650M; CPU pilot: see pockets_net_cpu.yaml)
data:
  manifest: data/processed/manifest.csv
  pdb_dir: data/pockets_ds/pdb
  cache_dir: data/cache/net
  esm: facebook/esm2_t33_650M_UR50D     # null = no ESM-2 (ablation)
  n_probe: 768
  n_surf: 512
  limit: 0
  require_interaction: true    # hotspot labels only where the ligand atom really makes that interaction
  druglike_only: false         # true: train the field on drug-like ligands only
  probe_potential: true        # per-probe interaction potential as input channels and as a masked target
  # Chemistry the model has never had. Both default to **false**, so `full` is still the arm the pre-registered
  # predictions were written against; the `probe_metal`, `probe_electrostatic` and `probe_chemistry` arms turn them
  # on and are measured as additions. They flip to true only on a gain that clears the pre-registered threshold.
  probe_metal: false           # 6 channels: nearest distance and occupancy-weighted count, per metal group
  probe_electrostatic: false   # screened-Coulomb potential and |E| as scalars, the field itself as a vector channel
  # Per-probe MSA conservation: weighted mean, max and how much of the lining was scored at all. The one external
  # signal with a measured effect on train-dissimilar structures, and the one that needs an alignment per target --
  # nothing here produces one, so the arm fails loudly rather than training on zeros if the files are absent.
  probe_conservation: false
  # Atom counts at 10, 12 and 15 A: P2Rank's protrusion, which our probe channels stop short of at 8 A. Of the four
  # additions this is the one our own measurement backs (0.7999 -> 0.8469 candidate AUC), so it is the one to run
  # first -- but it is still measured as an addition rather than switched on untested.
  probe_protrusion: false
  conservation_dir: data/conservation   # one `<pdb>.txt` per structure: `residue_index score`, as P2Rank reads it
  # Where the probes go. The first trained ablation says probes are the architecture: removing them costs 0.263
  # site top-1, while the surface module, the language model, the degree-2 channels and chirality are all within
  # two seed standard deviations of zero. `ligandable` spends the probe budget by the per-point model's prediction
  # instead of at random inside each buriedness tier, using the fold models so no structure is scored by a model
  # that saw its ligands. `tiered` is the previous behaviour and the comparison arm.
  probe_sampling: ligandable   # ligandable | tiered
  point_model_tag: native      # which models/point_<tag>_fold*.txt to place probes with
  # Fraction of the probe budget placed by score; the rest keeps the tiered random order. At 1.0 almost no probe
  # sits far from a ligand, so the site head has nothing to reject.
  # Measured on 19 structures at the shipped settings (2026-10-06): this placement gives an occupancy positive
  # rate of **0.230**, against **0.133** for `tiered`. The balancing weights are therefore 3.3 and 6.5, so
  # `occ_pos_weight: 3.0` below is right for this arm and **half of what `tiered` needs** -- which is why the
  # `probe_tiered` arm sets its own, or the comparison between the two placements would be confounded with class
  # weighting on the loss that the comparison is about.
  probe_ligandable_frac: 0.5
split:
  val_fold: 0                            # 5-fold CV by cluster: run once per fold
model:
  backbone: cartesian        # cartesian (hand-written l<=2) or e3nn (spherical harmonics, any lmax)
  lmax: 2                    # e3nn backbone only
  recycles: 2                # probes are moved to their predicted centres and relinked this many extra times
  dim: 128
  layers: 5
  heads: 8
  n_rbf: 32
  cutoff: 10.0
  equivariant: true
  invariant_mode: frames     # only read when equivariant is false: frames (fair) or distances (blinded)
  use_vectors: true
  use_tensors: true
  chiral: true
  use_surface: true
  use_probes: true
  dropout: 0.1
  # Sites as entities that compete with one another. Everything else in this network is a per-node score, so no
  # head could represent "this pocket, not that one" -- which is the measured failure: on the COACH420 structures
  # our first prediction gets wrong, the right candidate is second in 24 of 53 cases. The tokens are formed by the
  # evaluation's own rule (confidence order, NMS at 6 A) so the list the decoder ranks is the list top-1 is
  # computed from. `no_site_decoder` is the comparison arm.
  site_decoder: true
  site_layers: 2
  n_site_tokens: 32
  site_nms: 6.0              # the evaluation's non-redundancy radius, so the proposals are the scored objects
  site_membership: 8.0       # angstroms of the soft membership kernel from a site to its probes
  # How a probe moves between recycling passes. "center" jumps it onto its own predicted centre in one step;
  # "flow" walks it `flow_step` angstroms along the direction head's prediction, so refinement is driven by the two
  # mechanisms the ablation found to matter (the probes, and the dense direction signal) and every intermediate
  # position is supervised. `probe_flow` is the arm.
  probe_update: center       # center | flow
  flow_step: 2.0
  # dot: attention logits from the edge MLP, the original form. gaussian: a kernel on variance-normalised feature
  # differences with one learnable width per head, after Gaussian Dynamic Attention (Wang et al. 2026). It reads
  # only invariants, so equivariance is unchanged, and it costs `layers * heads` parameters against the O(dim^2) a
  # key-query projection would. Their own ablation puts it at about +3.3 % DCC over dot-product on the same model.
  attn_kernel: dot           # dot | gaussian
  # How a site's member probes collapse into one score. P2Rank sums the squares of its per-point ligandability
  # and reports that PRANK tested the mean and rejected it; GrASP and VN-EGNN average; YuelPocket takes the peak.
  # Three accurate methods, three rules, no published comparison -- in every one of them it is a hyperparameter
  # rather than an ablation. The default is P2Rank's, being the rule the strongest ranker uses.
  site_agg: sum_sq           # sum_sq | mean | max | sum
eval:
  # Post-hoc temperature scaling of the occupancy head. Reported two ways: what one scalar does to the head's ECE,
  # and -- the number that does not exist in this literature -- what it does to a sum-of-squares site ranking.
  # Calibration cannot change a ranking by max or mean, because temperature is monotone, but sum of squares is not
  # monotone-invariant, and sum of squares is the rule P2Rank ranks with and our own `site_agg` default. The
  # temperature is fitted on a hash-split half of the structures and reported on the other half.
  calibrate: true
  calibration_fit_frac: 0.5
loss:
  hungarian: true            # one-to-one matching of proposals to sites (false = nearest-probe form, for the ablation)
  mask_frac: 0.15            # self-supervised masked-residue task
  pot_mask_frac: 0.2         # fraction of probes whose potential channels are hidden and predicted
  w_potential: 0.3
  recycle_weight: 0.5        # weight of the intermediate recycling passes (deep supervision)
  w_seq: 0.3
  w_size: 0.1
  w_res: 1.0
  w_occ: 1.0
  w_center: 0.5
  w_conf: 0.5
  w_hot: 1.0
  w_dir: 0.5                 # P12 cosine loss to the nearest ligand atom, on every probe near exactly one site
  w_listwise: 0.3            # P2 listwise ordering of probes inside one structure
  w_site_rank: 1.0           # listwise ordering of the decoder's site list -- the objects the metric scores
  w_site_margin: 0.5         # the single comparison top-1 decides: best correct site against best incorrect one
  site_margin: 1.0           # how far apart in logits that comparison must come out
  w_prop: 0.5
  occ_pos_weight: 3.0        # (1-p)/p for this arm's measured positive rate of 0.230; see data.probe_ligandable_frac
  res_pos_weight: 3.0
stages:
  # P6 staged training. Stage 1 converges the dense per-node heads with the sparse ranking terms switched off, then
  # stage 2 turns them on; the sparse terms otherwise compete with a dense signal from epoch 1 against an untrained
  # trunk. Zero parameter and zero time cost. Set `enabled: false` for the single-stage comparison arm.
  enabled: true
  warmup_epochs: 20          # epochs of stage 1 (dense only); the rest of `optim.epochs` is stage 2
  stage1_zero: [w_center, w_conf, w_listwise, w_size, w_prop]
optim:
  lr: 0.0005
  weight_decay: 0.01
  epochs: 60
  accumulate: 4
  warmup_epochs: 2
  ema: 0.999
  patience: 10
  seed: 0
  rotate: true
  # Noise augmentation. Rotation is a no-op for an equivariant model, so these are the only augmentations that
  # actually train an invariance we do not already have. The sigmas are the ones Shiota et al. measured (PLOS ONE
  # 2024), where this was worth +0.0976 combined PR-AUC against +0.0256 for 2.6x the training structures.
  augment: {pos: 0.0, feat: 0.0, drop: 0.0}     # off by default; the `noise_aug` arm turns it on
  amp: bf16
